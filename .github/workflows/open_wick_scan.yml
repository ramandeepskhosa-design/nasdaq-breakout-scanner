name: Opening Gap-Up No-Lower-Wick Scan

on:
  schedule:
    # NSE: first 15-min candle (9:15-9:30 AM IST) completes at 9:30 — scan
    # at 9:35 AM IST for a safe data-availability buffer.
    - cron: "05 4 * * 1-5"    # 9:35 AM IST
    # NASDAQ+S&P 500: US market opens 9:30 AM ET (~7:00 PM IST during EDT),
    # first 15-min candle completes 9:45 ET — scan at 7:20 PM IST.
    - cron: "50 13 * * 1-5"   # 7:20 PM IST
  workflow_dispatch: {}   # manual trigger always runs both

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: NSE opening wick scan
        if: github.event.schedule == '05 4 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nse_breakout_scan.py open_wick

      - name: NASDAQ + S&P 500 opening wick scan
        if: github.event.schedule == '50 13 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python breakout_scan.py open_wick
